name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Normalize layout
        run: |
          set -e
          mkdir -p AzerothSurvivors
          if [ ! -f AzerothSurvivors/App.swift ]; then
            SRC=$(find . -name 'App.swift' -not -path './.git/*' | head -1)
            if [ -z "$SRC" ]; then echo "App.swift not found"; exit 1; fi
            mv "$SRC" AzerothSurvivors/App.swift
          fi
          if [ ! -f download_site.py ]; then
            SRC=$(find . -name 'download_site.py' -not -path './.git/*' | head -1)
            if [ -z "$SRC" ]; then echo "download_site.py not found"; exit 1; fi
            mv "$SRC" download_site.py
          fi
          test -f AzerothSurvivors/App.swift
          test -f download_site.py

      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: www/data
          key: wow-site-data-v1

      - name: Download game site (~1.5 GB)
        run: python3 download_site.py www

      - name: Patch site for iOS (GPU workarounds)
        run: python3 patch_site.py www

      - name: Build app bundle
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="AzerothSurvivors.app"
          rm -rf "$APP" Payload
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -framework SwiftUI \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            -framework Network \
            -O \
            -o "$APP/AzerothSurvivors" \
            AzerothSurvivors/App.swift

          chmod +x "$APP/AzerothSurvivors"
          cp -R www "$APP/www"

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Azeroth Survivors</string>
            <key>CFBundleExecutable</key>
            <string>AzerothSurvivors</string>
            <key>CFBundleIdentifier</key>
            <string>com.wowsurvivors.player</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>AzerothSurvivors</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsLocalNetworking</key>
              <true/>
            </dict>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key>
              <false/>
            </dict>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIStatusBarHidden</key>
            <true/>
            <key>UIRequiresFullScreen</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UIDeviceFamily</key>
            <array>
              <integer>1</integer>
              <integer>2</integer>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP/Info.plist"
          file "$APP/AzerothSurvivors"
          du -sh "$APP"

      - name: Add app icon
        run: |
          set -e
          if [ ! -f icon.png ]; then echo "icon.png not found, skip"; exit 0; fi
          APP="AzerothSurvivors.app"
          add() { sips -z "$2" "$2" icon.png --out "$APP/$1" >/dev/null; }
          add AppIcon20x20@2x.png 40
          add AppIcon20x20@3x.png 60
          add AppIcon29x29@2x.png 58
          add AppIcon29x29@3x.png 87
          add AppIcon40x40@2x.png 80
          add AppIcon40x40@3x.png 120
          add AppIcon60x60@2x.png 120
          add AppIcon60x60@3x.png 180
          add AppIcon76x76@2x.png 152
          add AppIcon83.5x83.5@2x.png 167
          sips -z 1024 1024 icon.png --out "$APP/AppIcon1024x1024.png" >/dev/null
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :CFBundleIconFiles array" \
              -c "Add :CFBundleIconFiles:0 string AppIcon60x60" \
              -c "Add :CFBundleIconFiles:1 string AppIcon76x76" \
              -c "Add :CFBundleIconFiles:2 string AppIcon83.5x83.5" \
              -c "Add :CFBundleIcons dict" \
              -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" \
              -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" \
              -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon60x60" \
              "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -r AzerothSurvivors.app Payload/
          zip -qr AzerothSurvivors.ipa Payload
          ls -lh AzerothSurvivors.ipa

      - name: Pack app shell (quick transfer)
        run: |
          set -e
          rm -rf shell && mkdir -p shell
          rsync -a --exclude www AzerothSurvivors.app shell/
          cd shell && zip -qr ../AzerothSurvivors-shell.zip AzerothSurvivors.app
          ls -lh ../AzerothSurvivors-shell.zip

      - name: Upload app shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-shell
          path: AzerothSurvivors-shell.zip
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzerothSurvivors-ipa
          path: AzerothSurvivors.ipa
          retention-days: 7
